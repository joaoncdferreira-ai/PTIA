[project]
name = "ptia-content-engine"
version = "0.1.0"
description = "Semi-automatic editorial engine for PTIA AI content curation."
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "feedparser>=6.0.11",
    "numpy>=2.4.6",
    "openai>=2.0.0",
    "Pillow>=12.0.0",
    "pyairtable>=3.0.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.1",
    "rapidfuzz>=3.9.0",
    "requests>=2.32.0",
    "tzdata>=2024.1",
    "xlrd>=2.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
norecursedirs = [".venv", "node_modules", ".git", ".tmp", ".vercel"]

[tool.ruff]
line-length = 100
target-version = "py311"
