name: PTIA Weekly Newsletter

on:
  schedule:
    # Prepare on Thursday, then run an idempotent Friday recovery well before 09:00 Lisbon.
    - cron: "35 18 * * 4"
    - cron: "5 2 * * 5"
  workflow_dispatch:
    inputs:
      live:
        description: "Create or recover the Brevo campaign"
        required: true
        default: false
        type: boolean
      send_at:
        description: "Optional ISO-8601 delivery time, e.g. 2026-06-12T17:00:00+01:00"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ptia-weekly-newsletter
  cancel-in-progress: false

jobs:
  newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      BREVO_LIST_IDS: ${{ secrets.BREVO_LIST_IDS }}
      BREVO_MAX_RECIPIENTS: "300"
      PTIA_NEWSLETTER_FROM_EMAIL: ${{ secrets.PTIA_NEWSLETTER_FROM_EMAIL }}
      PTIA_NEWSLETTER_FROM_NAME: "PTIA"
      PTIA_NEWSLETTER_REPLY_TO: ${{ secrets.PTIA_NEWSLETTER_REPLY_TO }}

    steps:
      - name: Checkout current editorial state
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install engine
        run: python -m pip install --disable-pip-version-check -e .

      - name: Validate newsletter compilation
        run: python scripts/github_newsletter_runner.py --json

      - name: Schedule Friday delivery
        if: github.event_name == 'schedule'
        run: >-
          python scripts/github_newsletter_runner.py
          --live
          --scheduled-trigger
          --scheduled-cron "${{ github.event.schedule }}"
          --json

      - name: Manually create or recover campaign
        if: github.event_name == 'workflow_dispatch' && inputs.live == true
        env:
          PTIA_SEND_AT: ${{ inputs.send_at }}
        run: >-
          python scripts/github_newsletter_runner.py
          --live
          --send-at "$PTIA_SEND_AT"
          --json
