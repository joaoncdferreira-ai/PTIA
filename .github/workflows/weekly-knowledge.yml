name: PTIA Weekly Knowledge Index

on:
  schedule:
    - cron: "0 9 * * 1"
      timezone: "Europe/Lisbon"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ptia-weekly-knowledge
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout current editorial state
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install engine
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Validate engine
        run: python -m pytest -q

      - name: Build weekly edition
        run: python scripts/update_ptia_knowledge.py

      - name: Commit generated edition
        run: |
          if git diff --quiet -- config/ptia_knowledge.json site/assets/quem-e-quem.json data/knowledge_review.jsonl data/knowledge_runs.jsonl site/recursos site/ia-em-portugal site/ferramentas site/prompts site/glossario site/metodologia-indice site/assets/ptia-index; then
            echo "No knowledge changes."
            exit 0
          fi
          git config user.name "ptia-automation"
          git config user.email "actions@users.noreply.github.com"
          git add config/ptia_knowledge.json site/assets/quem-e-quem.json data/knowledge_review.jsonl data/knowledge_runs.jsonl site/recursos site/ia-em-portugal site/ferramentas site/prompts site/glossario site/metodologia-indice site/assets/ptia-index
          git commit -m "Update PTIA weekly knowledge index"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
