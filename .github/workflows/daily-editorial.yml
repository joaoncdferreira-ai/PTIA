name: PTIA Daily Editorial Preparation

on:
  schedule:
    - cron: "0 18 * * 1-5"
      timezone: "Europe/Lisbon"
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum number of packages waiting in A Rever"
        required: true
        default: "6"
        type: string
      scout:
        description: "Discover and verify new stories before selection"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: ptia-daily-editorial
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_SEARCH_MODEL: gemini-2.5-flash
      GEMINI_SEARCH_TIMEOUT_SECONDS: "90"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PTIA_IMAGE_PROVIDER: auto
      PTIA_IMAGE_MODEL: gpt-image-2
      PTIA_IMAGE_QUALITY: medium
      PTIA_EDITORIAL_ASSETS_DIR: site/assets/editorial-review
      PTIA_CLOUD_STATE_ENABLED: "false"

    steps:
      - name: Checkout current engine
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install engine
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Validate required cloud automation secrets
        shell: bash
        run: |
          test -n "$GEMINI_API_KEY" || { echo "Missing GEMINI_API_KEY"; exit 1; }

      - name: Validate editorial automation boundary
        run: >-
          python -m pytest -q
          tests/test_editorial_scoring.py
          tests/test_editorial_quality.py
          tests/test_editorial_automation.py

      - name: Fill the A Rever queue
        if: github.event_name == 'schedule' || inputs.scout == true
        run: >-
          python -m ptia_engine.cli editorial-auto
          --limit "${{ github.event_name == 'workflow_dispatch' && inputs.limit || '6' }}"

      - name: Fill from verified signals only
        if: github.event_name == 'workflow_dispatch' && inputs.scout == false
        run: >-
          python -m ptia_engine.cli editorial-auto
          --limit "${{ inputs.limit }}"
          --no-scout

      - name: Publish editorial review queue
        shell: bash
        run: |
          review_paths=(
            data/radar_signals.jsonl
            data/editorial_topics.jsonl
            data/editorial_fact_packs.jsonl
            data/editorial_automation_runs.jsonl
            data/final_posts.jsonl
            site/assets/editorial-review
          )
          if [ -z "$(git status --porcelain -- "${review_paths[@]}")" ]; then
            echo "No editorial queue changes."
            exit 0
          fi
          git config user.name "ptia-automation"
          git config user.email "actions@users.noreply.github.com"
          git add -f -- "${review_paths[@]}"
          git commit -m "Prepare PTIA editorial review queue"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
