name: PTIA Saturday Resources Posts

on:
  schedule:
    # Friday 18:00 UTC = 19:00 Lisbon during summer time.
    - cron: "0 18 * * 5"
  workflow_dispatch:
    inputs:
      date:
        description: "Target Saturday date, YYYY-MM-DD. Empty = next Saturday."
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: ptia-saturday-resources-posts
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout current editorial state
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install engine
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Validate resources post generator
        run: python -m pytest -q tests/test_resources_posts.py

      - name: Prepare Saturday resources posts
        env:
          TARGET_DATE: ${{ inputs.date }}
        run: >-
          python scripts/prepare_saturday_resources_posts.py
          --date "$TARGET_DATE"
          --json

      - name: Publish review queue
        shell: bash
        run: |
          git config user.name "ptia-automation"
          git config user.email "actions@users.noreply.github.com"
          git add data/final_posts.jsonl
          if git diff --cached --quiet; then
            echo "No Saturday resources changes."
            exit 0
          fi
          git commit -m "Prepare PTIA Saturday resources posts"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
